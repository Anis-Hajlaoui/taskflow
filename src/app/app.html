<div class="min-h-screen">
  <header class="bg-slate-950 text-white">
    <div class="mx-auto flex max-w-6xl flex-col gap-4 px-5 py-7 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[.2em] text-cyan-300">Gestion de projet</p>
        <h1 class="mt-1 text-3xl font-bold">TaskFlow</h1>
        <p class="mt-1 text-sm text-slate-300">Organisez vos projets, tâches et collaborateurs.</p>
      </div>
      <app-view-toggle [activeView]="view()" (viewChange)="setView($event)" />
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-5 py-8">
    @if (view() === 'projects') {
      <app-project-list />
    } @else {
      <app-user-list />
    }
  </main>
  <footer class="mx-auto max-w-6xl px-5 pb-8 text-center text-xs text-slate-500">TaskFlow · TP 2 Components et Data Binding</footer>
</div>
